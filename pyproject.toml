[project]
name = "edgemem"
version = "0.1.0"
description = "Disagreement-durable edge memory engine on Qdrant Edge"
requires-python = ">=3.12"
dependencies = [
    "qdrant-edge-py==0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgemem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: long-running scenario tests",
]
